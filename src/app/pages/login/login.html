<main class="login-wrapper">

  <div class="login-container">
    <div class="header-section">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
          <ellipse cx="5.5" cy="5.5" rx="1.7" ry="2.4" />
          <ellipse cx="10" cy="3.5" rx="1.7" ry="2.4" />
          <ellipse cx="14.5" cy="4" rx="1.7" ry="2.4" />
          <ellipse cx="18.5" cy="6.5" rx="1.7" ry="2.4" />
          <path d="M12 10c-3.5 0-7 2.8-7 6.2 0 2.4 1.4 4.3 3.8 4.3 1.1 0 1.9-.5 3.2-1.1 1.3.6 2.1 1.1 3.2 1.1 2.4 0 3.8-1.9 3.8-4.3C19 12.8 15.5 10 12 10z" />
        </svg>
      </div>
      <h1>Bem-vindo de volta</h1>
      <p>Entre com seu e-mail e senha</p>
    </div>

    <div class="card-login">
      <form>
        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" placeholder="seu@email.com" name="email" [(ngModel)]="email">
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" placeholder="••••••••" name="senha" [(ngModel)]="senha">
        </div>

        <div class="opcoes-extras">
          <label class="checkbox-label">
            <input type="checkbox"> Lembrar-me
          </label>
          <a href="#">Esqueci a senha</a>
        </div>

        <button type="button" (click)="fazerLogin()">
          Entrar <span class="arrow">→</span>
        </button>
      </form>
    </div>

    <div class="footer-section">
      <p class="link-cadastro">
        Ainda não tem conta? <a href="#">Cadastre-se</a>
      </p>

      <div class="tcc-footer">
        FEMA · TCC — Análise e Desenvolvimento de Sistemas, 2026
      </div>
    </div>
  </div>
</main>
