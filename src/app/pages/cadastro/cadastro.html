<main class="login-wrapper">
  <div class="login-container">
    <div class="header-section">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><ellipse cx="5.5" cy="5.5" rx="1.7" ry="2.4" /><ellipse cx="10" cy="3.5" rx="1.7" ry="2.4" /><ellipse cx="14.5" cy="4" rx="1.7" ry="2.4" /><ellipse cx="18.5" cy="6.5" rx="1.7" ry="2.4" /><path d="M12 10c-3.5 0-7 2.8-7 6.2 0 2.4 1.4 4.3 3.8 4.3 1.1 0 1.9-.5 3.2-1.1 1.3.6 2.1 1.1 3.2 1.1 2.4 0 3.8-1.9 3.8-4.3C19 12.8 15.5 10 12 10z" /></svg>
      </div>
      <span class="brand-name">PetDay</span>
      <h1>Crie sua conta</h1>
      <p>Preencha os dados para se cadastrar</p>
    </div>

    <div class="card-login">
      <form (ngSubmit)="fazerCadastro()">
        <div class="input-group">
          <label>Nome Completo</label>
          <input type="text" [(ngModel)]="nome" name="nome" placeholder="Seu nome" autocomplete="off" required>
        </div>

        <div class="input-group">
          <label>E-mail</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="seu@email.com" autocomplete="off" required>
        </div>

        <div class="input-group">
          <label>Telefone / Contato</label>
          <input type="tel" [(ngModel)]="contato" name="contato" placeholder="(11) 99999-9999" (input)="aplicarMascaraTelefone($event)" maxlength="15" autocomplete="off" required>
        </div>

        <div class="form-row" style="display: flex; gap: 10px;">
          <div class="input-group" style="flex: 2;">
            <label>Rua</label>
            <input type="text" [(ngModel)]="rua" name="rua" placeholder="Nome da rua" autocomplete="off" required>
          </div>
          <div class="input-group" style="flex: 1;">
            <label>Número</label>
            <input type="text" [(ngModel)]="numero" name="numero" placeholder="123" autocomplete="off" required>
          </div>
        </div>

        <div class="input-group">
          <label>Bairro</label>
          <input type="text" [(ngModel)]="bairro" name="bairro" placeholder="Seu Bairro" autocomplete="off" required>
        </div>

        <div class="input-group">
          <label>Senha</label>
          <div class="input-icon-wrapper">
            <input [type]="mostrarSenha ? 'text' : 'password'" [(ngModel)]="senha" name="senha" placeholder="••••••••" autocomplete="new-password" required>
            <span class="icon-eye" (click)="toggleSenha()" style="cursor: pointer;">
              @if (mostrarSenha) {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              } @else {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              }
            </span>
          </div>
        </div>

        <button type="submit" class="btn-entrar" style="margin-top: 8px;">Cadastrar →</button>
      </form>
    </div>

    <div class="footer-section">
      <p class="link-cadastro">Já tem uma conta?
        <a routerLink="/login">Faça Login</a>
      </p>

      <div class="tcc-footer">
        FEMA · TCC — Análise e Desenvolvimento de Sistemas, 2026
      </div>
    </div>
  </div>
</main>
