<main class="login-wrapper">

  <div class="login-container">
    <div class="header-section">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
          <ellipse cx="5.5" cy="5.5" rx="1.7" ry="2.4" />
          <ellipse cx="10" cy="3.5" rx="1.7" ry="2.4" />
          <ellipse cx="14.5" cy="4" rx="1.7" ry="2.4" />
          <ellipse cx="18.5" cy="6.5" rx="1.7" ry="2.4" />
          <path d="M12 10c-3.5 0-7 2.8-7 6.2 0 2.4 1.4 4.3 3.8 4.3 1.1 0 1.9-.5 3.2-1.1 1.3.6 2.1 1.1 3.2 1.1 2.4 0 3.8-1.9 3.8-4.3C19 12.8 15.5 10 12 10z" />
        </svg>
      </div>
      <h1>Recuperar Senha</h1>
      <p>Insira seu e-mail e defina uma nova senha</p>
    </div>

    <div class="card-login">
      <form>
        <div class="input-group">
          <label>E-mail</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="seu@email.com">
        </div>

        <div class="input-group">
          <label>Nova Senha</label>
          <input type="password" [(ngModel)]="novaSenha" name="novaSenha" placeholder="••••••••">
        </div>

        <div class="input-group">
          <label>Confirmar Nova Senha</label>
          <input type="password" [(ngModel)]="confirmaSenha" name="confirmaSenha" placeholder="••••••••">
        </div>

        <button type="button" class="btn-entrar" (click)="$event.preventDefault(); redefinirSenha()">Atualizar Senha →</button>
      </form>
    </div>

    <div class="footer-section">
      <p class="link-cadastro">Lembrou da senha?
        <a routerLink="/login">Faça Login</a>
      </p>

      <div class="tcc-footer">
        FEMA · TCC — Análise e Desenvolvimento de Sistemas, 2026
      </div>
      
    </div>
  </div>
</main>
